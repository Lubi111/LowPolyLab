<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thank You</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8eea8e, #57c7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .thankyou-box {
            background-color: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 60px;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            color: #444;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background-color: rgb(44, 182, 22);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            transform: scale(1.05);
            background-color: chartreuse;
        }
    </style>
</head>

<body>

    <div class="thankyou-box">
        <h1>🎉</h1>

        <h2>Thank you for your order!</h2>

        <p>
            Your Axolotl Keychain will soon begin its journey to you 🦎
        </p>

        <a href="index.html">Back to shop</a>
    </div>

</body>

</html>
